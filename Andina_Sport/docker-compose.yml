services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: [kafka_data:/var/lib/kafka/data]
  cassandra:
    image: cassandra:5.0.3
    environment:
      MAX_HEAP_SIZE: 700M
      HEAP_NEWSIZE: 100M
    volumes: [cass_data:/var/lib/cassandra]
  neo4j:
    image: neo4j:5.26.0-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Complete .env}
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    ports: ["127.0.0.1:7474:7474","127.0.0.1:7687:7687"]
    volumes: [neo_data:/data]
  s3:
    image: motoserver/moto:5.1.16
    environment:
      MOTO_PORT: 5000
  app:
    build: .
    working_dir: /proyecto
    volumes: [".:/proyecto"]
    env_file: .env
    environment:
      BROKER: kafka:9092
      CASSANDRA_HOST: cassandra
      NEO4J_URI: bolt://neo4j:7687
  spark:
    image: apache/spark:4.0.1-python3
    user: "0:0"
    working_dir: /proyecto
    volumes: [".:/proyecto"]
    entrypoint: ["/opt/spark/bin/spark-submit","--master","local[2]","--driver-memory","1400m"]
volumes:
  kafka_data:
  cass_data:
  neo_data:
